name: CI/CD Deployment

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm --prefix backend install
          npm --prefix frontend install

      - name: Validate Backend Entry
        run: |
          node -e "import('./backend/server.js').then(() => console.log('Backend entry verified.')).catch(e => { console.error(e); process.exit(1); })"

      - name: Validate Frontend Build
        run: |
          cd frontend
          npm run build

  deploy:
    name: Deploy to Vercel
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel via CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not set. If using native Vercel GitHub integration, Vercel deploys automatically on branch push."
            exit 0
          fi
          npm install -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
